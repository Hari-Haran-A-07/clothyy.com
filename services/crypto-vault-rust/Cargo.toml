[package]
name = "clothyyy-crypto-vault"
version = "0.1.0"
edition = "2021"
authors = ["CLOTHYYY Security Architecture <security@clothyyy.com>"]

[dependencies]
actix-web = "4.5"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
